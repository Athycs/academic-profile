<script>
const fallback={"name":"Abraham Kaggwa","subtitle":"Public Health and Medical Big Data Researcher","eyebrow":"Academic research profile","tagline":"Epidemiology · Population health · Health data science","photo":"Profile.png","theme":"melbourne","accent":"#173b77","links":[{"label":"LinkedIn","url":"https://www.linkedin.com/in/abraham-kaggwa-20040a98/"},{"label":"GitHub","url":"https://github.com/Athycs"},{"label":"MIT IDSS / Great Learning certificate","url":"https://www.mygreatlearning.com/certificate/HSBGZACR"}],"sections":[{"id":"overview","title":"Overview","visible":true,"items":[{"title":"Academic biography","description":"I am a researcher trained in public health, medical big data, epidemiology and human nutrition. My research investigates how lifestyle behaviours, existing health conditions and socioeconomic factors influence mortality, healthy ageing and opportunities for prevention. I have analysed longitudinal data from the Korean Genome and Epidemiology Study (KoGES-HEXA) and worked in community nutrition and public health programming in Uganda."}]},{"id":"research","title":"Research interests","visible":true,"items":[{"title":"Healthy ageing and multimorbidity","description":"Long-term trajectories of functional health, chronic conditions and longevity."},{"title":"Lifestyle and mortality","description":"Combined behavioural exposures, survival and years of life lost."},{"title":"Health inequalities","description":"Socioeconomic circumstances, equity and preventive public health."},{"title":"Digital health","description":"Safety, implementation and equity of AI in primary care."},{"title":"Cancer prevention and early detection","description":"Longitudinal risk assessment and opportunities for earlier investigation."}]},{"id":"projects","title":"Research projects","visible":true,"items":[{"title":"Lifestyle, morbidity and mortality in KoGES-HEXA","description":"Longitudinal analysis of combined lifestyle scores, morbidity and years of life lost."},{"title":"Real-world impact of multimodal AI triage in primary care","description":"Systematic review of quality outcomes and implementation factors; manuscript in revision."},{"title":"Community nutrition and district nutrition action planning","description":"Public health programme experience with the Lutheran World Federation in Uganda."}]},{"id":"works","title":"Scholarly works and publications","visible":true,"items":[{"title":"Effect of morbidity on the association between lifestyle and mortality in the Health Examinee cohort","description":"Kaggwa A, Kityo A, Lee S-A. Epidemiology and Health (2026).","url":"https://doi.org/10.4178/epih.e2026022"},{"title":"Fruit and Vegetable Intake, and Metabolic Syndrome Components: A Population-Based Study","description":"Kityo A, Kaggwa A. Biology and Life Sciences Forum (2022).","url":"https://doi.org/10.3390/IECN2022-12365"},{"title":"Influence of Roasting on the Proximate, Functional and Sensory Properties of Jackfruit Seeds and Amaranth Grain Composite Complementary Flours","description":"Nabubuya A, Mugabi R, Kaggwa A, Ainebyona P, Nalugya R. Tanzania Journal of Science (2022).","url":"https://doi.org/10.4314/tjs.v48i1.15"}]},{"id":"methods","title":"Research methods and expertise","visible":true,"items":[{"title":"Epidemiology and survival analysis","description":"Cox proportional hazards modelling, restricted cubic splines, flexible parametric models, effect modification and sensitivity analyses."},{"title":"Evidence synthesis","description":"PRISMA 2020, MMAT, QUADAS-2, GRADE and GRADE-CERQual."},{"title":"Health data science","description":"Longitudinal cohort analysis, statistical modelling, data visualisation and machine learning."}]},{"id":"education","title":"Education and credentials","visible":true,"items":[{"title":"Master of Public Health · University of Manchester","description":"Epidemiology, population health, digital public health and applied statistics."},{"title":"MSc Medical Big Data · Kangwon National University","description":"Global Korea Scholarship (GKS); medical data analysis, biomedical informatics and machine learning."},{"title":"BSc Human Nutrition · Makerere University","description":"Nutrition and public health."}]},{"id":"experience","title":"Professional experience","visible":true,"items":[{"title":"Nutrition Officer · Lutheran World Federation, Uganda","description":"Nutrition programme delivery and contributions to district nutrition action planning."},{"title":"Research experience · KoGES-HEXA","description":"Longitudinal cohort research during postgraduate study in South Korea."}]},{"id":"awards","title":"Scholarships, awards and conferences","visible":true,"items":[{"title":"Global Korea Scholarship (GKS)","description":"Postgraduate scholarship for Medical Big Data studies at Kangwon National University."},{"title":"Best Presentation Award","description":"Research presentation on lifestyle and life expectancy at a preventive medicine and public health conference in Busan; exact year and event title to be confirmed."}]},{"id":"networks","title":"Collaborations and research networks","visible":true,"items":[{"title":"KoGES collaborative research","description":"Research with Anthony Kityo and Sang-Ah Lee on lifestyle, morbidity and mortality."},{"title":"Community public health in Uganda","description":"Work with local nutrition planning processes through Lutheran World Federation programmes."}]},{"id":"training","title":"MIT IDSS / Great Learning training and projects","visible":true,"items":[{"title":"Data Science and Machine Learning: Making Data Driven Decisions","description":"December 2023 – April 2024. Professional certificate; certificate ID HSBGZACR. This is not an MIT academic degree.","url":"https://www.mygreatlearning.com/certificate/HSBGZACR"},{"title":"Building a recommendation system to recommend the best Amazon products to users","description":"March 2024. Rank-based, similarity-based and matrix factorisation recommendation methods."},{"title":"Predicting Potential Customers","description":"March 2024. Decision trees, random forests and hyperparameter tuning."},{"title":"FoodHub Order Analysis","description":"January 2024. Exploratory analysis, visualisation and statistics."}]},{"id":"contact","title":"Contact and academic links","visible":true,"items":[{"title":"Research collaboration","description":"For research and professional enquiries."}]}]};
function make(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function safe(u){try{const q=new URL(u,location.href);return ['https:','http:','mailto:'].includes(q.protocol)?q.href:''}catch{return ''}}
function render(d){document.title=d.name+' | Academic Research Profile';document.body.dataset.theme=d.theme||'melbourne';document.documentElement.style.setProperty('--accent',d.accent||'#173b77');for(const k of ['name','subtitle','eyebrow','tagline'])document.getElementById(k).textContent=d[k]||'';document.getElementById('footname').textContent=d.name||'';document.getElementById('year').textContent=new Date().getFullYear();const photo=document.getElementById('portrait');photo.style.backgroundImage='url("'+encodeURI(d.photo||'Profile.png')+'")';photo.setAttribute('aria-label','Portrait of '+d.name);const nav=document.getElementById('tabs'),main=document.getElementById('content');nav.replaceChildren();main.replaceChildren();(d.sections||[]).filter(s=>s.visible!==false).forEach(s=>{let a=make('a','',s.title);a.href='#'+s.id;nav.append(a);let section=make('section','section');section.id=s.id;section.append(make('h2','',s.title));(s.items||[]).forEach(i=>{let article=make('article','entry'),h=make('h3');if(i.url&&safe(i.url)){let link=make('a','',i.title);link.href=safe(i.url);link.target='_blank';link.rel='noopener noreferrer';h.append(link)}else h.textContent=i.title;article.append(h);if(i.description)article.append(make('p','',i.description));if(i.image&&safe(i.image)){let pic=make('img');pic.src=safe(i.image);pic.alt=i.title;pic.loading='lazy';pic.style.cssText='max-width:100%;max-height:380px;object-fit:contain;margin:10px 0';article.append(pic)}section.append(article)});main.append(section)});let links=document.getElementById('links');links.replaceChildren();(d.links||[]).forEach(l=>{if(!safe(l.url))return;let a=make('a','',l.label);a.href=safe(l.url);a.target='_blank';a.rel='noopener noreferrer';links.append(a)})}
fetch('./content.json?rev='+Date.now()).then(r=>{if(!r.ok)throw Error();return r.json()}).then(render).catch(()=>render(fallback));
</script></body></html>
